[project]
name = "memory-bench"
version = "0.0.1"
description = "A decision-scored bench for agent memory products"
license = "Apache-2.0"
authors = [{ name = "FNU Ratnavarma" }]
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
# One extra per product, pinned. The core has no runtime dependency.
mem0 = ["mem0ai==2.2.1"]
langmem = ["langmem==0.0.30", "langgraph==1.2.23", "langchain-openai==1.8.3", "langchain-core==1.8.3", "openai==3.55.1", "trustcall==0.0.39", "numpy==2.5.5"]
graphiti = ["graphiti-core[falkordb]==0.31.2", "httpx==0.28.1"]

[project.scripts]
bench = "memory_bench.cli:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.uv]
# Each product runs in its own environment (UV_PROJECT_ENVIRONMENT=.venv-<product> uv sync --extra <product>):
# product SDKs pin different versions of shared packages, so the extras are never installed together.
conflicts = [[{ extra = "mem0" }, { extra = "langmem" }, { extra = "graphiti" }]]
